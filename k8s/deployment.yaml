apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-app-deployment
  labels:
    app: hello-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hello-app

  template:
    metadata:
      labels:
        app: hello-app

    spec:
      containers:
        - name: hello-app
          image: us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: PORT
              value: "8080"

          volumeMounts:
            - name: app-tmp
              mountPath: /tmp

          readinessProbe:
            httpGet:
              path: /
              port: 8080

          livenessProbe:
            httpGet:
              path: /
              port: 8080

      volumes:
        - name: app-tmp
          emptyDir: {}
